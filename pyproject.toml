[tool.poetry]
name = "pybd"
version = "0.1.0"
description = ""
authors = ["Andrei Tihomirov <moon200505@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
psycopg2 = "^2.9.11"
requests = "^2.32.5"
poetry-core = "^2.2.1"
black = "^25.11.0"
flake8 = "^7.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
config = "^0.5.1"
utils = "^1.0.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = [
    'venv',
    'tests',
    ]

[tool.black]
line-length = 119
exclude = '''
    (
    /(
        \.git
    )/
)
'''

[tool.isort]
line_length = 119